server {
    listen 80;
    server_name _;
    charset utf-8;

    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    
    location /api/ {
        proxy_pass http://backend-service:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}