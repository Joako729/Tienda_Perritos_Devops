name: Deploy to Amazon EKS

on:
  push:
    branches:
      - deploy                  # Se activa al empujar a tu rama deploy
  pull_request:
    branches:
      - deploy                  # Se activa en pull requests a deploy

env:
  AWS_REGION: us-east-1                  # Región de AWS usada en el laboratorio
  EKS_CLUSTER_NAME: TP-eks-cluster       # Tu clúster real en la web

jobs:
  deploy:
    name: Build, Push to ECR and Deploy to EKS
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio de GitHub
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Configurar las credenciales de AWS usando los Secrets obligatorios
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Requerido para AWS Learner Lab de Duoc
        aws-region: ${{ env.AWS_REGION }}

    # 3. Autenticarse en Amazon ECR (Elastic Container Registry)
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # 4. Construir y subir las imágenes de Docker de los microservicios
    - name: Build, Tag, and Push Images to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Microservicio: Frontend
        docker build -t $ECR_REGISTRY/tienda-frontend:latest ./frontend
        docker push $ECR_REGISTRY/tienda-frontend:latest
        
        # Microservicio: Backend
        docker build -t $ECR_REGISTRY/tienda-backend:latest ./backend
        docker push $ECR_REGISTRY/tienda-backend:latest
        
        # Microservicio: Base de Datos
        docker build -t $ECR_REGISTRY/tienda-db:latest ./db || echo "No DB Dockerfile found, skipping"
        docker push $ECR_REGISTRY/tienda-db:latest || echo "No DB image to push, skipping"

    # 5. Instalar y configurar kubectl con tu contexto de EKS real
    - name: Update Kubeconfig for Amazon EKS
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

    # 6. Desplegar los manifiestos de Kubernetes (.yaml) apuntando a la carpeta correcta
    - name: Deploy Manifests to EKS Cluster
      run: |
        kubectl apply -f k8s/
        kubectl create namespace tienda_perritos || echo "El namespace ya existe"